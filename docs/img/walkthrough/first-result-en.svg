<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Setup and first use</title><desc id="desc">Three stages: prepare the Microsoft service and access; install the SAP files and connection; check a sample result in SAP and Microsoft.</desc>
<rect x="0" y="0" width="1280" height="480" rx="0" fill="#f4f7fa" />
<rect x="0" y="0" width="1280" height="480" rx="0" fill="#ffffff" />
<rect x="44" y="34" width="5" height="26" rx="0" fill="#176e78" />
<text x="64" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#536779">abap-graph  /  SETUP ORDER</text>
<text x="44" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#152b3e">Setup and first use</text>
<text x="44" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#536779">The same order for every route: prepare, install and check.</text>
<polyline points="44,193 1236,193" fill="none" stroke="#dbe3ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="44" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#176e78">01</text>
<text x="44" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#152b3e">Microsoft preparation</text>
<text x="44" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#152b3e">Service and access</text>
<text x="44" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">Prepare access to the mailbox,</text>
<text x="44" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">site, calendar or channel.</text>
<polyline points="432,226 432,417" fill="none" stroke="#dbe3ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="454" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#176e78">02</text>
<text x="454" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#152b3e">SAP preparation</text>
<text x="454" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#152b3e">Files and connection</text>
<text x="454" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">Add the required ABAP files;</text>
<text x="454" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">configure the SM59 connection.</text>
<polyline points="842,226 842,417" fill="none" stroke="#dbe3ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="864" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#176e78">03</text>
<text x="864" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#152b3e">Check the result</text>
<text x="864" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#152b3e">Sample operation</text>
<text x="864" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">Run a sample and check it</text>
<text x="864" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#536779">in SAP and Microsoft.</text>
</svg>