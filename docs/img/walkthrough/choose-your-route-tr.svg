<title id="title">SAP ve Microsoft 365: kullanım alanları</title><desc id="desc">İhtiyaç duyulan bölüm ayrı kurulabilir. Ortak yardımcı dosya bir kez eklenir. Teams kanal bildirimi İş Akışlarını, diğer yollar Microsoft Graph bağlantısını kullanır. Excel hücre işlemlerinin destek sınırı ilgili rehberde açıklanır.</desc>
